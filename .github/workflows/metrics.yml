name: Metrics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          filename: output/metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: cappyzawa
          template: classic
          config_timezone: Asia/Tokyo
          base: activity, community, repositories
          base_indepth: yes
